name: Update yarn.lock

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  update-yarn-lock:
    name: Update yarn.lock
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/update-yarn-lock.yml@main
    with:
      app-client-id: ${{ vars.PR_BOT_CLIENT_ID }}
      update-wasm-yarn-lock: true
    secrets:
      app-private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}
