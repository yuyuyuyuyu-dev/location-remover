name: Update Wasm yarn.lock

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# The job force-pushes one fixed branch, so overlapping runs would fight over it.
concurrency:
  group: update-wasm-yarn-lock

jobs:
  update:
    name: Update Wasm yarn.lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pushing the branch and opening the pull request go through the
      # yuyuyuyuyu-dev-pr-bot App instead of GITHUB_TOKEN, because a pull request
      # opened by GITHUB_TOKEN does not trigger CI, which would leave the updated
      # lock file unverified.
      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup build
        uses: ./.github/actions/setup-build

      # Gradle provides its own Node and Yarn for this task, so no Node setup is
      # needed here. Only the Wasm store is upgraded because that is the only
      # lock file this repository tracks.
      - name: Upgrade yarn.lock
        run: ./gradlew kotlinWasmUpgradeYarnLock

      - name: Check for an update
        id: lock
        run: |
          if git diff --quiet -- kotlin-js-store/wasm/yarn.lock; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request
        if: steps.lock.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: chore/update-wasm-yarn-lock
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # GitHub attributes a commit to the App only when the author email
          # carries the bot account's numeric id, which is not known ahead of time.
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          # Without this the daily run would force-push a commit identical to the
          # one already on the branch and restart CI on the open pull request.
          if git fetch --quiet --depth=1 origin "$BRANCH" 2>/dev/null &&
            git diff --quiet FETCH_HEAD -- kotlin-js-store/wasm/yarn.lock; then
            echo "The open pull request already carries this yarn.lock."
            exit 0
          fi

          git switch --create "$BRANCH"
          git commit --message "chore: update Wasm yarn.lock" -- kotlin-js-store/wasm/yarn.lock
          # Reusing one branch refreshes the open pull request rather than piling
          # up a new one on every run.
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: update Wasm yarn.lock" \
              --body "\`kotlin-js-store/wasm/yarn.lock\` was regenerated by \`./gradlew kotlinWasmUpgradeYarnLock\`. Opened automatically by [the Update Wasm yarn.lock workflow](${RUN_URL})."
          fi
